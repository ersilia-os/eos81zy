Status: Ready
Title: Antimicrobial activity prediction against Enterococcus faecium from 
  public ChEMBL data
Description: Predicts activity against Enterococcus faecium, one of the ESKAPE pathogens
  and a frequent source of hospital-acquired infection where vancomycin resistance
  is now common. Eight classifiers were fitted to separate ChEMBL assay pools and
  aggregated into a quality-weighted consensus. Enterococci tolerate many antibacterials
  intrinsically, so predicted growth inhibition based on structure alone should be
  confirmed phenotypically before a compound is pursued.
